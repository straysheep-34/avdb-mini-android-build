plugins {
    id 'com.android.application'
}

android {
    namespace 'com.avdbmini.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.avdbmini.android'
        minSdk 26
        targetSdk 36
        versionCode 200
        versionName '2.0-gecko'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:156.0.20260921121718'
}
