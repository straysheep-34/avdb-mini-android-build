<title>AVDB Mini</title>
<style>

.heroHome{border:1px solid #202735;border-radius:22px;min-height:230px;padding:36px;background:radial-gradient(circle at 75% 20%,rgba(111,148,255,.20),transparent 38%),linear-gradient(135deg,#121925,#0e1118 65%);display:flex;align-items:flex-end;margin-bottom:30px;box-shadow:var(--shadow)}.heroHome h1{font-size:32px;margin:0 0 10px;letter-spacing:-.5px}.heroHome p{margin:0;color:#a7b0be;font-size:14px;max-width:660px;line-height:1.7}.heroBadge{display:inline-flex;padding:6px 9px;border:1px solid #33425f;background:#182239;color:#bcd0ff;border-radius:999px;font-size:12px;margin-bottom:14px}
.section{margin:28px 0 34px}.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}.sectionTitle{font-size:20px;font-weight:760}.sectionSub{font-size:12px;color:var(--muted);margin-top:5px}.more{border:0;background:transparent;color:#a9baf2;cursor:pointer;font-size:13px;padding:7px 2px}.more:hover{color:#fff}.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.posterCard{min-width:0;cursor:pointer;position:relative}.posterWrap{position:relative;aspect-ratio:800/538;border-radius:12px;overflow:hidden;background:#171b23;border:1px solid #222936;box-shadow:0 9px 20px rgba(0,0,0,.23)}.posterWrap img{width:100%;height:100%;display:block;object-fit:contain;transition:transform .22s ease,filter .22s ease}.posterCard:hover img{transform:scale(1.035);filter:brightness(1.08)}.playHover{position:absolute;inset:0;background:linear-gradient(transparent 56%,rgba(0,0,0,.75));opacity:0;transition:.2s;display:flex;align-items:flex-end;padding:12px}.posterCard:hover .playHover{opacity:1}.codeBadge{font-size:11px;color:#e4ecff;background:rgba(16,25,43,.88);border:1px solid rgba(163,188,255,.26);padding:5px 7px;border-radius:7px}.pcTitle{font-size:13px;line-height:1.45;font-weight:650;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcMeta{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardRemove{position:absolute;right:44px;top:8px;z-index:5;width:28px;height:28px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(9,11,16,.78);color:#fff;cursor:pointer;display:grid;place-items:center;opacity:.15;transition:.2s}.posterCard:hover .cardRemove{opacity:1}.cardFav{position:absolute;right:8px;top:8px;z-index:8;width:32px;height:32px;border-radius:999px;border:1px solid rgba(255,255,255,.20);background:rgba(20,22,27,.82);color:#aeb4bd;cursor:pointer;display:grid;place-items:center;font-size:19px;line-height:1;opacity:0;transform:scale(.94);transition:opacity .16s ease,transform .16s ease,color .16s ease,background .16s ease,border-color .16s ease;backdrop-filter:blur(8px);box-shadow:0 3px 12px rgba(0,0,0,.25)}.posterCard:hover .cardFav,.cardFav.saved{opacity:1;transform:scale(1)}.cardFav:hover{color:#e7e9ed;background:rgba(40,42,48,.92);border-color:rgba(255,255,255,.32)}.cardFav.saved{color:#ff4d68;background:rgba(54,18,27,.90);border-color:rgba(255,88,113,.55);text-shadow:0 0 12px rgba(255,61,94,.38)}.cardFav.saved:hover{color:#ff3859;background:rgba(70,17,29,.96)}.skeleton{background:linear-gradient(100deg,#151a23 20%,#202633 40%,#151a23 60%);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.pageHead{display:flex;align-items:center;gap:16px;margin:8px 0 20px}.back{border:1px solid #2a3240;background:#141923;color:#dbe4f2;border-radius:10px;padding:9px 12px;cursor:pointer}.pageHead h2{margin:0;font-size:25px}.pageHead .muted{color:var(--muted);font-size:13px;margin-top:4px}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:34px 0 4px}.pager button{border:1px solid #2b3443;background:#151b25;color:#dbe2ec;border-radius:9px;padding:9px 14px;cursor:pointer}.pager button:disabled{opacity:.4;cursor:not-allowed}.pager span{font-size:13px;color:var(--muted)}

.detailPage{display:grid;grid-template-columns:minmax(0,1fr) minmax(460px,50%);gap:24px}.detailLeft,.detailRight{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.detailHero{display:grid;grid-template-columns:360px 1fr;gap:24px;padding:22px}.detailPoster{width:360px;aspect-ratio:800/538;object-fit:contain;border-radius:13px;background:#1a1e27}.detailTitle{font-size:24px;line-height:1.45;font-weight:760;margin:2px 0 7px}.detailCode{font-size:13px;color:var(--accent2)}.detailActions{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.kv{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#1d2431;color:#cbd6e9;border:1px solid #2b3548}.tagPill{cursor:pointer;transition:.18s}.tagPill:hover{background:#293a5c;border-color:#5d7ab2;color:#fff;transform:translateY(-1px)}.info{display:grid;grid-template-columns:68px 1fr;gap:8px 10px;font-size:13px;line-height:1.55;margin-top:15px}.label{color:var(--muted)}.desc{padding:0 22px 22px;color:#c2cad6;font-size:13px;line-height:1.78}.viewerTop{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.viewerTitle{font-size:14px;font-weight:700}.sources{padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line)}.srcbtn{border:1px solid #303b4d;background:#1b2230;color:#e6edf8;border-radius:9px;padding:8px 11px;font-weight:650;cursor:pointer}.srcbtn.active{background:#29406d;border-color:#587fd0}.viewer{background:#020304;aspect-ratio:16/9;display:grid;place-items:center;position:relative;overflow:hidden}.viewer iframe,.viewer video{width:100%;height:100%;border:0;background:#000}.viewer:fullscreen{width:100vw;height:100vh;max-width:none;aspect-ratio:auto;background:#000}.viewer:fullscreen iframe,.viewer:fullscreen video{width:100%;height:100%}.viewer:-webkit-full-screen{width:100vw;height:100vh;aspect-ratio:auto;background:#000}.viewerExit{display:none;position:absolute;top:16px;left:16px;z-index:20;border:1px solid rgba(255,255,255,.28);background:rgba(9,11,16,.82);color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(8px)}.viewer:fullscreen .viewerExit,.viewer:-webkit-full-screen .viewerExit{display:block}.viewerHint{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;padding:40px}.shield{position:absolute;top:10px;right:10px;z-index:3;background:rgba(12,16,23,.78);border:1px solid #344052;color:#c9d5e7;padding:6px 8px;border-radius:8px;font-size:11px;pointer-events:none}.viewerFoot{padding:12px 14px;display:flex;align-items:center;gap:8px;justify-content:space-between}.viewerFoot .hint{font-size:11px;color:var(--muted);line-height:1.5}.secondary{border:1px solid #303949;background:#181e29;color:#e2e8f2;border-radius:9px;padding:8px 11px;cursor:pointer}.secondary:disabled{opacity:.4;cursor:not-allowed}.primarySmall{border:0;background:#6f94ff;color:#07101f;border-radius:9px;padding:8px 12px;font-weight:750;cursor:pointer}.dangerSmall{border:1px solid #5a3137;background:#27161a;color:#ffb4bc;border-radius:9px;padding:7px 10px;cursor:pointer}.empty{min-height:330px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px;border:1px dashed #29313f;border-radius:16px}.notice{font-size:11px;color:#8e98a7}
.favToolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}.folderSection{background:#10151e;border:1px solid #242d3b;border-radius:16px;padding:17px;margin:0 0 20px}.folderHead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:15px}.folderName{font-size:17px;font-weight:740}.folderCount{font-size:12px;color:var(--muted);margin-left:7px}.folderActions{display:flex;gap:7px;flex-wrap:wrap}.folderEmpty{padding:28px 12px;text-align:center;color:#7f8a99;border:1px dashed #293340;border-radius:12px;font-size:13px}
.modalBackdrop{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.68);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}.modal{width:min(460px,100%);background:#121821;border:1px solid #2a3444;border-radius:18px;padding:20px;box-shadow:0 30px 90px rgba(0,0,0,.55)}.modal h3{margin:0 0 6px;font-size:19px}.modal p{margin:0 0 16px;color:#8f99a7;font-size:12px;line-height:1.6}.modal label{display:block;color:#aab4c3;font-size:12px;margin:12px 0 6px}.modal select,.modal input{width:100%;height:42px;border:1px solid #313b4c;background:#0e131b;color:#fff;border-radius:10px;padding:0 11px;outline:none}.modalRow{display:flex;gap:8px}.modalRow input{flex:1}.modalButtons{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:24px;bottom:24px;z-index:300;background:#171e29;border:1px solid #334056;color:#eaf0f8;padding:11px 14px;border-radius:11px;box-shadow:0 15px 44px rgba(0,0,0,.42);font-size:13px;animation:toastIn .18s ease}@keyframes toastIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:1280px){.row{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.detailPage{grid-template-columns:1fr}.detailRight{order:-1}}@media(max-width:850px){.topbar{padding:10px 14px;height:auto;min-height:64px;flex-wrap:wrap}.nav{display:none}.searchwrap{margin-left:0;width:100%}.searchwrap input{width:100%}.main{padding:20px 14px 38px}.row,.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.heroHome{min-height:190px;padding:24px}.heroHome h1{font-size:26px}.detailHero{grid-template-columns:190px 1fr;gap:15px;padding:15px}.detailPoster{width:190px}.detailTitle{font-size:18px}.detailCode{font-size:12px}.info{grid-template-columns:58px 1fr;font-size:12px}.desc{padding:0 15px 16px}.pageHead h2{font-size:21px}.filterReset{margin-left:0}.folderHead{align-items:flex-start;flex-direction:column}}

html{scroll-behavior:auto}button,a,input,select{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation;min-height:44px}.cardFav{opacity:1;transform:none;width:44px;height:44px;font-size:23px;right:4px;top:4px}.cardFav:not(.saved){color:#c3c8d1}.cardRemove{opacity:1;width:44px;height:44px;right:52px;top:4px}.posterCard:hover img{transform:none;filter:none}.pager{flex-wrap:wrap}.modal{max-height:85dvh;overflow:auto}.modalBackdrop{padding-bottom:env(safe-area-inset-bottom)}
@media(max-width:760px){.topbar{display:grid;grid-template-columns:1fr;gap:8px;padding:12px 12px 8px;padding-top:max(12px,env(safe-area-inset-top));position:sticky;height:auto}.brand{font-size:20px}.nav{grid-row:3;overflow:auto;width:100%;gap:4px}.nav button{font-size:13px;padding:8px 10px}.searchwrap{margin:0;width:100%;gap:8px}.searchwrap input{flex:1;min-width:0;width:100%;font-size:16px;height:44px}.searchbtn,.favIcon{height:44px;min-width:44px}.main{padding:12px 12px calc(28px + env(safe-area-inset-bottom))}.row,.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}.heroHome{min-height:130px;padding:18px;margin-bottom:20px;border-radius:16px}.heroHome h1{font-size:25px}.heroHome p{font-size:12px}.heroBadge{display:none}.section{margin:20px 0}.sectionTitle{font-size:18px}.pcTitle{font-size:13px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:38px}.pageHead{gap:10px}.pageHead h2{font-size:21px}.back{min-width:72px}.detailPage{display:flex;flex-direction:column;gap:14px}.detailHero{display:flex;flex-direction:column;padding:14px;gap:14px}.detailPoster{width:100%;max-width:none}.detailTitle{font-size:19px}.detailRight{min-width:0}.viewer{min-height:210px}.viewerFoot{flex-wrap:wrap;gap:10px}.sources{flex-wrap:wrap}.srcbtn,.tagPill{min-height:44px}.folderHead{align-items:flex-start;gap:10px;flex-wrap:wrap}.folderActions{display:flex;gap:8px}.filterBar{gap:6px;padding:10px}.filterChip{min-height:40px}.pager{gap:8px}.pager button{padding:9px 12px}.modal{width:100%;border-radius:18px}.modalBackdrop{align-items:flex-end;padding:10px 10px max(10px,env(safe-area-inset-bottom))}.modal input,.modal select{font-size:16px;min-height:44px}.toast{max-width:90vw;bottom:max(24px,env(safe-area-inset-bottom))}}
@media(min-width:761px) and (max-width:1100px){.row,.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.detailPage{grid-template-columns:1fr}.topbar{flex-wrap:wrap;padding:12px}.searchwrap{width:100%}.searchwrap input{flex:1;width:auto}}

<body>
<div class="app">
  <header class="topbar">
    <div class="brand" id="brand">AVDB <span>Mini</span></div>
    <nav class="nav">
      <button id="navHome" class="active">Home</button>
      <button data-cat="1">Censored</button><button data-cat="2">Uncensored</button><button data-cat="3">Uncensored Leaked</button><button data-cat="4">Amateur</button><button data-cat="5">Chinese AV</button><button data-cat="6">Hentai</button><button data-cat="7">English Subtitle</button>
    </nav>
    <div class="searchwrap"><input id="searchInput" placeholder="搜索番号、标题、演员或标签…" autocomplete="off"><button class="searchbtn" id="searchBtn" aria-label="搜索" title="搜索"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button><button class="favIcon" id="navFavorites" type="button" title="收藏夹" aria-label="打开收藏夹">♥</button></div>
  </header>
  <main class="main"><div id="status" class="status"></div><div id="view"></div></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s); const view=$('#view');
const categories=[
 {id:1,name:'Censored',en:'Censored'},
 {id:2,name:'Uncensored',en:'Uncensored'},
 {id:3,name:'Uncensored Leaked',en:'Uncensored Leaked'},
 {id:4,name:'Amateur',en:'Amateur'},
 {id:5,name:'Chinese AV',en:'Chinese AV'},
 {id:6,name:'Hentai',en:'Hentai'},
 {id:7,name:'English Subtitle',en:'English Subtitle'}
];
let current={view:'home',cat:null,page:1,totalPages:1,query:'',queryLabel:'',queryKind:'search',filters:[],detail:null,sourceUrl:''};
function historySnapshot(){return {view:current.view,cat:current.cat,page:current.page||1,query:current.query||'',queryLabel:current.queryLabel||'',queryKind:current.queryKind||'search',filters:[...(current.filters||[])],detail:current.detail||null}}
function historyURL(s){if(s.view==='category')return `#category/${s.cat}/${s.page||1}`;if(s.view==='search')return `#search/${encodeURIComponent(s.query||'')}/${s.page||1}`;if(s.view==='detail')return `#detail/${s.detail}`;if(s.view==='favorites')return '#favorites';return '#home'}
history.scrollRestoration='manual';
function syncHistory(mode='push'){if(mode==='push'&&history.state)history.replaceState({...history.state,scrollY:window.scrollY},'');window.scrollTo(0,0);if(mode==='none')return;const snap=historySnapshot(),url=historyURL(snap);if(mode==='replace'){history.replaceState(snap,'',url);return}const a=JSON.stringify(history.state||{}),b=JSON.stringify(snap);if(a!==b)history.pushState(snap,'',url)}
function goBack(){if(window.avdbBack())return;if(current.view!=='home')showHome(false,'replace')}
window.avdbBack=function(){const dialog=document.querySelector('dialog[open]');if(dialog){dialog.close('cancel');return true}if(document.fullscreenElement){document.exitFullscreen();return true}const modal=$('#modalRoot');if(modal&&modal.innerHTML){modal.innerHTML='';return true}if(current.view==='home')return false;history.back();return true};
let homeCache=new Map();
let favorites={folders:[]};
const cardMovieCache=new Map();
function favoriteFoldersFor(movieId){const id=String(movieId);return favorites.folders.filter(f=>(f.items||[]).some(x=>String(x.id)===id))}
function isFavorited(movieId){return favoriteFoldersFor(movieId).length>0}
function refreshFavoriteHearts(movieId){const id=String(movieId);const saved=isFavorited(id);document.querySelectorAll(`.cardFav[data-fav-id="${CSS.escape(id)}"]`).forEach(b=>{b.classList.toggle('saved',saved);b.setAttribute('aria-label',saved?'取消收藏':'收藏');b.title=saved?'取消收藏':'收藏'})}
function defaultFavoriteFolder(){let f=favorites.folders.find(x=>x.name==='默认收藏');if(!f){f={id:newFolderId(),name:'默认收藏',items:[]};favorites.folders.unshift(f)}return f}
async function toggleQuickFavorite(v){if(!v||v.id==null)return;const id=String(v.id),found=favoriteFoldersFor(id);if(found.length){for(const f of found)f.items=(f.items||[]).filter(x=>String(x.id)!==id);await saveFavorites();refreshFavoriteHearts(id);toast('已取消收藏');if(current.view==='favorites')showFavorites('replace');return}const f=defaultFavoriteFolder();f.items=f.items||[];f.items.unshift(favoriteMovieShape(v));await saveFavorites();refreshFavoriteHearts(id);toast('已收藏到“默认收藏”')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
function looksBrokenText(v){const s=String(v??'');return /\uFFFD|Ã.|Â.|â€|å[\x80-\xFF]|ä[\x80-\xFF]|æ[\x80-\xFF]|ç[\x80-\xFF]/.test(s)}
function cleanField(zh,en){if(Array.isArray(zh)){const ea=Array.isArray(en)?en:[];return zh.map((x,i)=>looksBrokenText(x)?(ea[i]??x):x)}return looksBrokenText(zh)?(en??zh):zh}
function setStatus(t='',err=false){$('#status').textContent=t;$('#status').className='status'+(err?' error':'')}
function img(v){return v.poster_url||v.thumb_url||''}
function title(v){return v.name||v.origin_name||v.movie_code||'未命名'}
function typeIdOf(v){const direct=Number(v.type_id||v.type||v.typeid||0);if(direct>=1&&direct<=7)return direct;const n=String(v.type_name||'').toLowerCase();const found=categories.find(c=>n===c.name.toLowerCase()||n.includes(c.name.toLowerCase()));return found?found.id:0}

function navActive(type,cat){document.querySelectorAll('.nav button,#navFavorites').forEach(b=>b.classList.remove('active'));if(type==='home')$('#navHome').classList.add('active');else if(type==='favorites')$('#navFavorites').classList.add('active');else if(type==='category'){const b=document.querySelector(`.nav button[data-cat="${cat}"]`);if(b)b.classList.add('active')}}
async function jsonFetch(url,options){const r=await fetch(url,options);let d={};try{d=await r.json()}catch(_){d={}}if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}

async function loadFavorites(){try{const d=JSON.parse(localStorage.getItem('avdb-mini-android-favorites-v1')||'{"folders":[]}');favorites=d&&Array.isArray(d.folders)?d:{folders:[]}}catch(_){favorites={folders:[]}}}

function newFolderId(){return 'f_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
async function createFolder(name){name=String(name||'').trim();if(!name)return null;if(favorites.folders.some(f=>f.name.toLowerCase()===name.toLowerCase())){toast('已有同名收藏夹');return null}const f={id:newFolderId(),name,items:[]};favorites.folders.push(f);await saveFavorites();return f}
async function renameFolder(id){const f=favorites.folders.find(x=>x.id===id);if(!f)return;const name=await mobilePrompt('新的收藏夹名称：',f.name);if(name===null)return;const n=name.trim();if(!n)return;if(favorites.folders.some(x=>x.id!==id&&x.name.toLowerCase()===n.toLowerCase())){toast('已有同名收藏夹');return}f.name=n;await saveFavorites();showFavorites('replace');toast('已重命名')}
async function deleteFolder(id){const f=favorites.folders.find(x=>x.id===id);if(!f)return;if(!await mobileConfirm(`确定删除收藏夹“${f.name}”以及其中的收藏记录吗？`))return;favorites.folders=favorites.folders.filter(x=>x.id!==id);await saveFavorites();showFavorites('replace');toast('收藏夹已删除')}
async function removeFavorite(folderId,movieId){const f=favorites.folders.find(x=>x.id===folderId);if(!f)return;f.items=(f.items||[]).filter(x=>String(x.id)!==String(movieId));await saveFavorites();showFavorites('replace');toast('已移出收藏夹')}
function favoriteMovieShape(v){return {id:v.id,name:v.name||'',origin_name:v.origin_name||'',movie_code:v.movie_code||'',poster_url:v.poster_url||'',thumb_url:v.thumb_url||'',year:v.year||'',actor:v.actor||[],type_name:v.type_name||'',type_id:typeIdOf(v)}}
function openFavoriteModal(v){const root=$('#modalRoot');const render=()=>{root.innerHTML=`<div class="modalBackdrop" id="favBackdrop"><div class="modal"><h3>收藏影片</h3><p>${esc(v.movie_code||'')} ${esc(title(v))}</p><label>选择收藏夹</label><select id="favFolderSelect">${favorites.folders.map(f=>`<option value="${esc(f.id)}">${esc(f.name)} (${(f.items||[]).length})</option>`).join('')||'<option value="">还没有收藏夹</option>'}</select><label>新建收藏夹</label><div class="modalRow"><input id="newFolderName" placeholder="例如：喜欢、待看、演员A"><button class="secondary" id="createFolderBtn">新建</button></div><div class="modalButtons"><button class="secondary" id="cancelFav">取消</button><button class="primarySmall" id="confirmFav" ${favorites.folders.length?'':'disabled'}>加入收藏</button></div></div></div>`;
 $('#cancelFav').onclick=()=>root.innerHTML='';$('#favBackdrop').onclick=e=>{if(e.target.id==='favBackdrop')root.innerHTML=''};

 $('#confirmFav').onclick=async()=>{const id=$('#favFolderSelect').value;const f=favorites.folders.find(x=>x.id===id);if(!f)return;if((f.items||[]).some(x=>String(x.id)===String(v.id))){toast('这个影片已经在该收藏夹中');root.innerHTML='';return}f.items=f.items||[];f.items.unshift(favoriteMovieShape(v));await saveFavorites();root.innerHTML='';toast(`已加入“${f.name}”`)};

async function showHome(force=false,historyMode='push'){current={...current,view:'home',cat:null,page:1,query:'',queryLabel:'',queryKind:'search',filters:[],detail:null};syncHistory(historyMode);navActive('home');setStatus('');view.innerHTML=`<section class="heroHome"><div><span class="heroBadge">Latest collection</span><h1>最新影片</h1><p>按类型浏览 AVDB 最新收录。你可以搜索番号、标题、演员或标签；进入详情后，点击任意标签即可继续寻找相似影片。</p></div></section><div id="homeSections"></div>`;const box=$('#homeSections');box.innerHTML=categories.map(c=>`<section class="section" id="homeCat${c.id}"><div class="sectionHead"><div><div class="sectionTitle">${esc(c.name)}</div><div class="sectionSub">${esc(c.en)} · 最新更新</div></div><button class="more" data-more="${c.id}">查看更多 →</button></div>${skeletonRow()}</section>`).join('');document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>showCategory(Number(b.dataset.more),1));
 const lang='zh';await Promise.all(categories.map(async c=>{try{let d=!force&&homeCache.get(lang+':'+c.id);if(!d){d=await jsonFetch(`/api/browse?t=${c.id}&pg=1&pagesize=10&lang=${lang}`);homeCache.set(lang+':'+c.id,d)}const sec=$('#homeCat'+c.id);if(sec){const row=sec.querySelector('.row');row.innerHTML=(d.list||[]).slice(0,10).map(v=>card(v)).join('')||'<div class="empty">暂无内容</div>';bindCards()}}catch(e){const sec=$('#homeCat'+c.id);if(sec){const row=sec.querySelector('.row');row.outerHTML=`<div class="empty">${esc(e.message)}</div>`}}}));
}
async function showCategory(cat,page=1,historyMode='push'){const c=categories.find(x=>x.id===cat)||categories[0];current={...current,view:'category',cat,page,query:'',queryLabel:'',filters:[],detail:null};syncHistory(historyMode);navActive('category',cat);setStatus(`正在加载 ${c.name}…`);view.innerHTML=`<div class="pageHead"><button class="back" id="backBtn">← 返回</button><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.en)} · 最新更新</div></div></div><div class="grid" id="grid">${Array.from({length:21},()=>'<div><div class="posterWrap skeleton"></div></div>').join('')}</div>`;$('#backBtn').onclick=()=>goBack();try{const d=await jsonFetch(`/api/browse?t=${cat}&pg=${page}&pagesize=25&lang=zh`);current.totalPages=Number(d.pagecount||1);$('#grid').innerHTML=(d.list||[]).map(v=>card(v)).join('')||'<div class="empty">暂无内容</div>';bindCards();view.insertAdjacentHTML('beforeend',pagerHTML(page,current.totalPages));bindPager(()=>showCategory(cat,current.page));setStatus(`共 ${Number(d.total||0).toLocaleString()} 条 · 第 ${page} 页`)}catch(e){setStatus(e.message,true);$('#grid').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}

function filterBarHTML(){return `<div class="filterBar"><span class="filterLabel">类型筛选</span>${categories.map(c=>`<button class="filterChip ${current.filters.includes(c.id)?'active':''}" data-filter="${c.id}">${esc(c.name)}</button>`).join('')}<button class="filterReset" id="filterReset">清除筛选</button><span class="resultNote">可多选</span></div>`}

async function fetchSearchSet(q,page,filters,kind='search'){const route='search';const key='q';const f=kind==='tag'?'&field=category':'';if(!filters.length)return jsonFetch(`/api/${route}?${key}=${encodeURIComponent(q)}&pg=${page}&pagesize=25&lang=zh${f}`);const parts=await Promise.all(filters.map(t=>jsonFetch(`/api/${route}?${key}=${encodeURIComponent(q)}&pg=${page}&pagesize=25&lang=zh&t=${t}${f}`)));const map=new Map();let total=0,totalPages=1;for(const d of parts){total+=Number(d.total||0);totalPages=Math.max(totalPages,Number(d.pagecount||1));for(const v of (d.list||[]))if(!map.has(String(v.id)))map.set(String(v.id),v)}return {list:[...map.values()],total,pagecount:totalPages}}
async function startSearch(q,kind='search',historyMode='push',label=''){q=String(q||'').trim();if(!q){setStatus('请输入搜索关键词。',true);return}const display=String(label||q).trim();$('#searchInput').value=display;current={...current,view:'search',page:1,query:q,queryLabel:display,queryKind:kind,filters:[],cat:null,detail:null};navActive('search');await loadSearchResults(historyMode)}

async function loadSearchResults(historyMode='push'){syncHistory(historyMode);const q=current.query,page=current.page,kind=current.queryKind||'search',display=current.queryLabel||q;const label=kind==='tag'?'标签结果':'搜索结果';setStatus(`正在加载${current.filters.length?'筛选后的':''}${label}…`);view.innerHTML=`<div class="pageHead"><button class="back" id="backBtn">← 返回</button><div><h2>${label}</h2><div class="muted">${kind==='tag'?'标签：':''}${esc(display)}</div></div></div>${filterBarHTML()}<div class="grid" id="grid">${Array.from({length:21},()=>'<div><div class="posterWrap skeleton"></div></div>').join('')}</div>`;$('#backBtn').onclick=()=>goBack();bindFilters();try{const d=await fetchSearchSet(q,page,current.filters,kind);current.totalPages=Number(d.pagecount||1);$('#grid').innerHTML=(d.list||[]).map(v=>card(v)).join('')||'<div class="empty">没有找到匹配结果</div>';bindCards();view.insertAdjacentHTML('beforeend',pagerHTML(page,current.totalPages));bindPager(()=>loadSearchResults());const filterText=current.filters.length?current.filters.map(id=>categories.find(c=>c.id===id)?.name).filter(Boolean).join(' + '):'全部类型';setStatus(`找到 ${Number(d.total||0).toLocaleString()} 条结果 · ${filterText} · 第 ${page} 页`)}catch(e){setStatus(e.message,true);$('#grid').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}

async function showFavorites(historyMode='push'){current={...current,view:'favorites',cat:null,detail:null};syncHistory(historyMode);navActive('favorites');setStatus('');await loadFavorites();view.innerHTML=`<div class="pageHead"><button class="back" id="backBtn">← 返回</button><div><h2>收藏夹</h2><div class="muted">手机本地保存</div></div></div><div class="favToolbar"><button class="primarySmall" id="newFolderTop">＋ 新建收藏夹</button></div><div id="foldersBox"></div>`;$('#backBtn').onclick=()=>goBack();$('#newFolderTop').onclick=async()=>{const n=await mobilePrompt('收藏夹名称：');if(n===null)return;const f=await createFolder(n);if(f){showFavorites('replace');toast('收藏夹已创建')}};const box=$('#foldersBox');if(!favorites.folders.length){box.innerHTML='<div class="empty">还没有收藏夹。点击“新建收藏夹”开始整理喜欢的影片。</div>';return}box.innerHTML=favorites.folders.map(f=>`<section class="folderSection"><div class="folderHead"><div><span class="folderName">${esc(f.name)}</span><span class="folderCount">${(f.items||[]).length} 部</span></div><div class="folderActions"><button class="secondary" data-rename-folder="${esc(f.id)}">重命名</button><button class="dangerSmall" data-delete-folder="${esc(f.id)}">删除</button></div></div>${(f.items||[]).length?`<div class="grid">${f.items.map(v=>card(v,`<button class="cardRemove" title="移出收藏夹" data-card-action="remove" data-remove-fav="${esc(f.id)}|${esc(v.id)}">×</button>`)).join('')}</div>`:'<div class="folderEmpty">这个收藏夹还是空的</div>'}</section>`).join('');bindCards();document.querySelectorAll('[data-rename-folder]').forEach(b=>b.onclick=()=>renameFolder(b.dataset.renameFolder));document.querySelectorAll('[data-delete-folder]').forEach(b=>b.onclick=()=>deleteFolder(b.dataset.deleteFolder));document.querySelectorAll('[data-remove-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [fid,mid]=b.dataset.removeFav.split('|');removeFavorite(fid,mid)})}

function episodeSources(ep){const out=[];if(!ep)return out;if(typeof ep==='string')out.push({name:'播放',url:ep});else if(Array.isArray(ep))ep.forEach((x,i)=>{if(typeof x==='string')out.push({name:'源 '+(i+1),url:x})});else{const data=ep.server_data;if(data&&typeof data==='object')Object.entries(data).forEach(([k,v])=>{if(typeof v==='string')out.push({name:k,url:v});else if(v&&v.link_embed)out.push({name:k,url:v.link_embed});else if(v&&v.url)out.push({name:k,url:v.url})});if(ep.link_embed)out.push({name:ep.server_name||'播放',url:ep.link_embed});if(ep.url)out.push({name:ep.server_name||'播放',url:ep.url})}return out.filter((x,i,a)=>x.url&&a.findIndex(y=>y.url===x.url)===i)}
async function openDetail(id,historyMode='push'){const previous={view:current.view,cat:current.cat,page:current.page,query:current.query,queryKind:current.queryKind,filters:[...current.filters]};current={...current,view:'detail',detail:id};syncHistory(historyMode);setStatus('正在读取详情…');view.innerHTML='<div class="empty">正在加载影片详情…</div>';try{const d=await jsonFetch(`/api/detail?id=${encodeURIComponent(id)}&lang=zh&bilingual=1`);const v=(d.list||[])[0];if(!v)throw new Error('没有找到影片详情');renderDetail(v,previous);setStatus('')}catch(e){setStatus(e.message,true);view.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}

/div></div><div class="viewerFoot"><div class="hint">播放与外部跳转由现有安卓内核管理。</div><div style="display:flex;gap:8px"><button id="fullscreenBtn" class="secondary" disabled>应用全屏（备用）</button><button id="restore" class="secondary" disabled>恢复播放</button></div></div></section></div>`;

 document.removeEventListener('fullscreenchange',window.__avdbFsSync||(()=>{}));window.__avdbFsSync=syncFsButton;document.addEventListener('fullscreenchange',syncFsButton);document.removeEventListener('webkitfullscreenchange',window.__avdbFsSyncWebkit||(()=>{}));window.__avdbFsSyncWebkit=syncFsButton;document.addEventListener('webkitfullscreenchange',syncFsButton);

 if(isDirect(s.url)){viewer.innerHTML=`<video controls autoplay playsinline src="${esc(s.url)}"></video><div class="shield">禁止新窗口</div>${exitBtn}`;bindExit();return}

}
async function restoreHistoryState(state){const s=state&&state.view?state:{view:'home'};if(s.view==='category'){await showCategory(Number(s.cat)||1,Number(s.page)||1,'none');return}if(s.view==='search'){current={...current,view:'search',cat:null,page:Number(s.page)||1,query:String(s.query||''),queryLabel:String(s.queryLabel||''),queryKind:s.queryKind||'search',filters:Array.isArray(s.filters)?s.filters.map(Number):[],detail:null};$('#searchInput').value=current.queryLabel||current.query;navActive('search');await loadSearchResults('none');return}if(s.view==='detail'&&s.detail){await openDetail(String(s.detail),'none');return}if(s.view==='favorites'){await showFavorites('none');return}await showHome(false,'none')}
window.addEventListener('popstate',async e=>{const modal=$('#modalRoot');if(modal)modal.innerHTML='';await restoreHistoryState(e.state);requestAnimationFrame(()=>window.scrollTo(0,Number(e.state?.scrollY)||0))});
document.addEventListener('keydown',async e=>{if(e.key==='Escape'&&(document.fullscreenElement===document.getElementById('viewer')||document.webkitFullscreenElement===document.getElementById('viewer'))){try{if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}catch(_){}}});
function mobileDialog(message,value,confirmOnly){return new Promise(resolve=>{const d=document.createElement('dialog');d.className='modal';d.style.cssText='background:#11151d;color:#f1f4f9;border:1px solid #303949;width:min(92vw,420px)';d.innerHTML=`<form method="dialog"><h3>${esc(message)}</h3>${confirmOnly?'':`<input id="dialogValue" value="${esc(value||'')}" style="width:100%;padding:12px;background:#191f2b;color:white;border:1px solid #303949;border-radius:9px">`}<div class="modalButtons"><button value="cancel" class="secondary">取消</button><button value="ok" class="primarySmall">确定</button></div></form>`;document.body.append(d);d.addEventListener('close',()=>{const result=d.returnValue==='ok'?(confirmOnly?true:d.querySelector('input').value):(confirmOnly?false:null);d.remove();resolve(result)},{once:true});d.showModal();if(!confirmOnly)d.querySelector('input').focus()})}
function mobilePrompt(message,value=''){return mobileDialog(message,value,false)}
function mobileConfirm(message){return mobileDialog(message,'',true)}
$('#brand').onclick=()=>showHome();$('#navHome').onclick=()=>showHome();$('#navFavorites').onclick=()=>showFavorites();document.querySelectorAll('.nav button[data-cat]').forEach(b=>b.onclick=()=>showCategory(Number(b.dataset.cat),1));$('#searchBtn').onclick=()=>doSearch(1);$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(1)});
loadFavorites().finally(()=>showHome(false,'replace'));
</script>
</body>
