<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AVDB Mini</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--panel2:#151a24;--text:#f1f4f9;--muted:#919aa9;--line:#242b37;--accent:#6f94ff;--accent2:#b9caff;--danger:#ff9090;--shadow:0 16px 50px rgba(0,0,0,.32)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#090b10;color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:50;height:68px;display:flex;align-items:center;gap:20px;padding:0 30px;background:rgba(9,11,16,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}.brand{font-size:21px;font-weight:780;letter-spacing:.2px;cursor:pointer;white-space:nowrap}.brand span{color:var(--accent)}.nav{display:flex;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none;white-space:nowrap;flex:1}.nav::-webkit-scrollbar{display:none}.nav button{background:transparent;color:#adb6c5;padding:9px 9px;border-radius:9px;font-size:12.5px;font-weight:650;border:0;cursor:pointer;flex:0 0 auto}.nav button:hover,.nav button.active{background:#171c26;color:#fff}.searchwrap{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}.searchwrap input{width:min(360px,34vw);height:40px;background:#121720;color:#fff;border:1px solid #29313f;border-radius:11px;padding:0 13px;outline:none}.searchwrap input:focus{border-color:#587bd3;box-shadow:0 0 0 3px rgba(88,123,211,.13)}select{height:40px;background:#121720;color:#dbe2ee;border:1px solid #29313f;border-radius:10px;padding:0 30px 0 10px;outline:none;max-width:180px}.searchbtn{height:40px;border:0;border-radius:10px;padding:0 16px;background:var(--accent);color:#07101f;font-weight:750;cursor:pointer}.main{max-width:1580px;margin:0 auto;padding:28px 30px 54px}.status{min-height:24px;color:var(--muted);font-size:13px;margin-bottom:6px}.status.error{color:var(--danger)}
.heroHome{border:1px solid #202735;border-radius:22px;min-height:230px;padding:36px;background:radial-gradient(circle at 75% 20%,rgba(111,148,255,.20),transparent 38%),linear-gradient(135deg,#121925,#0e1118 65%);display:flex;align-items:flex-end;margin-bottom:30px;box-shadow:var(--shadow)}.heroHome h1{font-size:32px;margin:0 0 10px;letter-spacing:-.5px}.heroHome p{margin:0;color:#a7b0be;font-size:14px;max-width:600px;line-height:1.7}.heroBadge{display:inline-flex;padding:6px 9px;border:1px solid #33425f;background:#182239;color:#bcd0ff;border-radius:999px;font-size:12px;margin-bottom:14px}
.section{margin:28px 0 34px}.sectionHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.sectionTitle{font-size:20px;font-weight:760}.sectionSub{font-size:12px;color:var(--muted);margin-top:5px}.more{border:0;background:transparent;color:#a9baf2;cursor:pointer;font-size:13px;padding:7px 2px}.more:hover{color:#fff}.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px}.posterCard{min-width:0;cursor:pointer}.posterWrap{position:relative;aspect-ratio:800/538;border-radius:12px;overflow:hidden;background:#171b23;border:1px solid #222936;box-shadow:0 9px 20px rgba(0,0,0,.23)}.posterWrap img{width:100%;height:100%;display:block;object-fit:contain;transition:transform .22s ease,filter .22s ease}.posterCard:hover img{transform:scale(1.035);filter:brightness(1.08)}.playHover{position:absolute;inset:0;background:linear-gradient(transparent 56%,rgba(0,0,0,.75));opacity:0;transition:.2s;display:flex;align-items:flex-end;padding:12px}.posterCard:hover .playHover{opacity:1}.codeBadge{font-size:11px;color:#e4ecff;background:rgba(16,25,43,.88);border:1px solid rgba(163,188,255,.26);padding:5px 7px;border-radius:7px}.pcTitle{font-size:13px;line-height:1.45;font-weight:650;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcMeta{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.skeleton{background:linear-gradient(100deg,#151a23 20%,#202633 40%,#151a23 60%);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
.pageHead{display:flex;align-items:center;gap:16px;margin:8px 0 24px}.back{border:1px solid #2a3240;background:#141923;color:#dbe4f2;border-radius:10px;padding:9px 12px;cursor:pointer}.pageHead h2{margin:0;font-size:25px}.pageHead .muted{color:var(--muted);font-size:13px;margin-top:4px}.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:34px 0 4px}.pager button{border:1px solid #2b3443;background:#151b25;color:#dbe2ec;border-radius:9px;padding:9px 14px;cursor:pointer}.pager button:disabled{opacity:.4;cursor:not-allowed}.pager span{font-size:13px;color:var(--muted)}
.detailPage{display:grid;grid-template-columns:minmax(0,1fr) minmax(460px,50%);gap:24px}.detailLeft,.detailRight{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}.detailHero{display:grid;grid-template-columns:360px 1fr;gap:24px;padding:22px}.detailPoster{width:360px;aspect-ratio:800/538;object-fit:contain;border-radius:13px;background:#1a1e27}.detailTitle{font-size:24px;line-height:1.45;font-weight:760;margin:2px 0 7px}.detailCode{font-size:13px;color:var(--accent2)}.kv{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#1d2431;color:#cbd6e9;border:1px solid #2b3548}.info{display:grid;grid-template-columns:68px 1fr;gap:8px 10px;font-size:13px;line-height:1.55;margin-top:15px}.label{color:var(--muted)}.desc{padding:0 22px 22px;color:#c2cad6;font-size:13px;line-height:1.78}.viewerTop{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.viewerTitle{font-size:14px;font-weight:700}.sources{padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line)}.srcbtn{border:1px solid #303b4d;background:#1b2230;color:#e6edf8;border-radius:9px;padding:8px 11px;font-weight:650;cursor:pointer}.srcbtn.active{background:#29406d;border-color:#587fd0}.viewer{background:#020304;aspect-ratio:16/9;display:grid;place-items:center;position:relative;overflow:hidden}.viewer iframe,.viewer video{width:100%;height:100%;border:0;background:#000}.viewer:fullscreen{width:100vw;height:100vh;max-width:none;aspect-ratio:auto;background:#000}.viewer:fullscreen iframe,.viewer:fullscreen video{width:100%;height:100%}.viewer:-webkit-full-screen{width:100vw;height:100vh;aspect-ratio:auto;background:#000}.viewerExit{display:none;position:absolute;top:16px;left:16px;z-index:20;border:1px solid rgba(255,255,255,.28);background:rgba(9,11,16,.82);color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;backdrop-filter:blur(8px)}.viewer:fullscreen .viewerExit,.viewer:-webkit-full-screen .viewerExit{display:block}.viewerHint{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;padding:40px}.shield{position:absolute;top:10px;right:10px;z-index:3;background:rgba(12,16,23,.78);border:1px solid #344052;color:#c9d5e7;padding:6px 8px;border-radius:8px;font-size:11px;pointer-events:none}.viewerFoot{padding:12px 14px;display:flex;align-items:center;gap:8px;justify-content:space-between}.viewerFoot .hint{font-size:11px;color:var(--muted);line-height:1.5}.secondary{border:1px solid #303949;background:#181e29;color:#e2e8f2;border-radius:9px;padding:8px 11px;cursor:pointer}.secondary:disabled{opacity:.4;cursor:not-allowed}.empty{min-height:330px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:40px;border:1px dashed #29313f;border-radius:16px}.notice{font-size:11px;color:#8e98a7}
@media(max-width:1280px){.row{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.detailPage{grid-template-columns:1fr}.detailRight{order:-1}}@media(max-width:850px){.topbar{padding:0 12px;height:auto;min-height:64px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px;gap:8px}.brand{font-size:19px}.nav{display:flex;order:3;width:100%;flex-basis:100%;overflow-x:auto}.nav button{font-size:11.5px;padding:8px 9px}.searchwrap{margin-left:0;width:100%;order:2}.searchwrap input{width:100%}.main{padding:20px 14px 38px}.row,.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.heroHome{min-height:190px;padding:24px}.heroHome h1{font-size:26px}.detailHero{grid-template-columns:190px 1fr;gap:15px;padding:15px}.detailPoster{width:190px}.detailTitle{font-size:18px}.detailCode{font-size:12px}.info{grid-template-columns:58px 1fr;font-size:12px}.desc{padding:0 15px 16px}.pageHead h2{font-size:21px}}

@media(max-width:520px){.main{padding:14px 10px 30px}.row,.grid{grid-template-columns:1fr 1fr;gap:9px}.cardTitle{font-size:12px}.cardMeta{font-size:10px}.heroHome{min-height:150px;padding:18px}.heroHome h1{font-size:23px}.section{margin-top:22px}.sectionTitle{font-size:16px}.detailHero{grid-template-columns:1fr;padding:12px}.detailPoster{width:100%;max-width:none}.detailPage{gap:12px}.detailLeft,.detailRight{border-radius:12px}.viewer{min-height:220px}.viewerFoot{align-items:stretch;flex-direction:column}.viewerFoot>div:last-child{width:100%}.viewerFoot button{flex:1}.pageHead{gap:10px}.pageHead h2{font-size:18px}.topbar select{max-width:150px}.searchbtn{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand" id="brand">AVDB <span>Mini</span></div>
    <nav class="nav"><button id="navHome" class="active">Home</button><button data-cat="1">Censored</button><button data-cat="2">Uncensored</button><button data-cat="3">Uncensored Leaked</button><button data-cat="4">Amateur</button><button data-cat="5">Chinese AV</button><button data-cat="6">Hentai</button><button data-cat="7">English Subtitle</button></nav>
    <div class="searchwrap"><input id="searchInput" placeholder="搜索番号或标题…" autocomplete="off"><select id="searchScope" aria-label="搜索范围"><option value="0">All</option><option value="1">Censored</option><option value="2">Uncensored</option><option value="3">Uncensored Leaked</option><option value="4">Amateur</option><option value="5">Chinese AV</option><option value="6">Hentai</option><option value="7">English Subtitle</option></select><button class="searchbtn" id="searchBtn">搜索</button></div>
  </header>
  <main class="main"><div id="status" class="status"></div><div id="view"></div></main>
</div>
<script>
const $=s=>document.querySelector(s); const view=$('#view');
const categories=[
 {id:1,name:'Censored',en:'Censored'},
 {id:2,name:'Uncensored',en:'Uncensored'},
 {id:3,name:'Uncensored Leaked',en:'Uncensored Leaked'},
 {id:4,name:'Amateur',en:'Amateur'},
 {id:5,name:'Chinese AV',en:'Chinese AV'},
 {id:6,name:'Hentai',en:'Hentai'},
 {id:7,name:'English Subtitle',en:'English Subtitle'}
];
let current={view:'home',cat:null,page:1,totalPages:1,query:'',searchCat:0,detail:null,sourceUrl:''};
let homeCache=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
// The upstream /zh endpoint occasionally returns already-mojibaked labels.
// Keep valid Chinese text untouched; replace obviously broken strings with the
// English fallback returned alongside the same record.
function looksBrokenText(v){
 const s=String(v??'');
 return /\uFFFD|Ã.|Â.|â€|å[\x80-\xFF]|ä[\x80-\xFF]|æ[\x80-\xFF]|ç[\x80-\xFF]/.test(s);
}
function cleanField(zh,en){
 if(Array.isArray(zh)){
   const ea=Array.isArray(en)?en:[];
   return zh.map((x,i)=>looksBrokenText(x)?(ea[i]??x):x);
 }
 return looksBrokenText(zh)?(en??zh):zh;
}
function setStatus(t='',err=false){$('#status').textContent=t;$('#status').className='status'+(err?' error':'')}
function img(v){return v.poster_url||v.thumb_url||''}
function title(v){return v.name||v.origin_name||v.movie_code||'未命名'}
function card(v){return `<article class="posterCard" data-id="${esc(v.id)}"><div class="posterWrap"><img src="${esc(img(v))}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.opacity=.12"><div class="playHover"><span class="codeBadge">${esc(v.movie_code||'查看详情')}</span></div></div><div class="pcTitle" title="${esc(title(v))}">${esc(title(v))}</div><div class="pcMeta">${esc([v.year,arr(v.actor)[0]].filter(Boolean).join(' · ')||v.type_name||'')}</div></article>`}
function bindCards(){document.querySelectorAll('.posterCard[data-id]').forEach(el=>el.onclick=()=>openDetail(el.dataset.id))}
function navActive(type,cat){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(type==='home')$('#navHome').classList.add('active');else{const b=document.querySelector(`.nav button[data-cat="${cat}"]`);if(b)b.classList.add('active')}}
async function jsonFetch(url){const r=await fetch(url);const d=await r.json();if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
function skeletonRow(){return `<div class="row">${Array.from({length:10},()=>'<div><div class="posterWrap skeleton"></div><div style="height:12px;margin-top:9px;border-radius:5px" class="skeleton"></div></div>').join('')}</div>`}
async function showHome(force=false){current={...current,view:'home',cat:null,page:1,query:'',detail:null};navActive('home');setStatus('');view.innerHTML=`<section class="heroHome"><div><span class="heroBadge">Latest collection</span><h1>最新影片</h1><p>按类型浏览 AVDB 最新收录。搜索只是辅助入口；从首页分类进入后可分页查看更多，再打开详情与播放。</p></div></section><div id="homeSections"></div>`;const box=$('#homeSections');box.innerHTML=categories.map(c=>`<section class="section" id="homeCat${c.id}"><div class="sectionHead"><div><div class="sectionTitle">${esc(c.name)}</div><div class="sectionSub">${esc(c.en)} · 最新更新</div></div><button class="more" data-more="${c.id}">查看更多 →</button></div>${skeletonRow()}</section>`).join('');document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>showCategory(Number(b.dataset.more),1));
 const lang='zh';
 await Promise.all(categories.map(async c=>{try{let d=!force&&homeCache.get(lang+':'+c.id);if(!d){d=await jsonFetch(`/api/browse?t=${c.id}&pg=1&pagesize=10&lang=${lang}`);homeCache.set(lang+':'+c.id,d)}const sec=$('#homeCat'+c.id);if(sec){const row=sec.querySelector('.row');row.innerHTML=(d.list||[]).slice(0,10).map(card).join('')||'<div class="empty">暂无内容</div>';bindCards()}}catch(e){const sec=$('#homeCat'+c.id);if(sec){const row=sec.querySelector('.row');row.outerHTML=`<div class="empty">${esc(e.message)}</div>`}}}));
}
async function showCategory(cat,page=1){const c=categories.find(x=>x.id===cat)||categories[0];current={...current,view:'category',cat,page,query:'',detail:null};navActive('category',cat);setStatus(`正在加载 ${c.name}…`);view.innerHTML=`<div class="pageHead"><button class="back" id="backBtn">← 首页</button><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.en)} · 最新更新</div></div></div><div class="grid" id="grid">${Array.from({length:21},()=>'<div><div class="posterWrap skeleton"></div></div>').join('')}</div>`;$('#backBtn').onclick=()=>showHome();try{const d=await jsonFetch(`/api/browse?t=${cat}&pg=${page}&pagesize=25&lang=zh`);current.totalPages=Number(d.pagecount||1);$('#grid').innerHTML=(d.list||[]).map(card).join('')||'<div class="empty">暂无内容</div>';bindCards();view.insertAdjacentHTML('beforeend',pagerHTML(page,current.totalPages));bindPager(()=>showCategory(cat,current.page));setStatus(`共 ${Number(d.total||0).toLocaleString()} 条 · 第 ${page} 页`)}catch(e){setStatus(e.message,true);$('#grid').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function pagerHTML(page,total){return `<div class="pager"><button id="prev" ${page<=1?'disabled':''}>上一页</button><span>第 ${page} / ${Math.max(1,total)} 页</span><button id="next" ${page>=total?'disabled':''}>下一页</button></div>`}
function bindPager(load){const p=$('#prev'),n=$('#next');if(p)p.onclick=()=>{current.page--;load()};if(n)n.onclick=()=>{current.page++;load()}}
async function doSearch(page=1){const q=$('#searchInput').value.trim();if(!q){setStatus('请输入番号或标题关键词。',true);return}const scope=Number($('#searchScope').value||0);const scopeName=scope===0?'All':(categories.find(x=>x.id===scope)?.name||'All');current={...current,view:'search',page,query:q,searchCat:scope,cat:null,detail:null};navActive('search');setStatus(`正在搜索 · ${scopeName}…`);view.innerHTML=`<div class="pageHead"><button class="back" id="backBtn">← 首页</button><div><h2>搜索结果</h2><div class="muted">${esc(q)} · ${esc(scopeName)}</div></div></div><div class="grid" id="grid">${Array.from({length:21},()=>'<div><div class="posterWrap skeleton"></div></div>').join('')}</div>`;$('#backBtn').onclick=()=>showHome();try{const typeArg=scope>0?`&t=${scope}`:'';const d=await jsonFetch(`/api/search?q=${encodeURIComponent(q)}&pg=${page}&pagesize=25&lang=zh${typeArg}`);current.totalPages=Number(d.pagecount||1);$('#grid').innerHTML=(d.list||[]).map(card).join('')||'<div class="empty">没有找到匹配结果</div>';bindCards();view.insertAdjacentHTML('beforeend',pagerHTML(page,current.totalPages));bindPager(()=>doSearch(current.page));setStatus(`找到 ${Number(d.total||0).toLocaleString()} 条结果 · ${scopeName} · 第 ${page} 页`)}catch(e){setStatus(e.message,true);$('#grid').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function episodeSources(ep){const out=[];if(!ep)return out;if(typeof ep==='string')out.push({name:'播放',url:ep});else if(Array.isArray(ep))ep.forEach((x,i)=>{if(typeof x==='string')out.push({name:'源 '+(i+1),url:x})});else{const data=ep.server_data;if(data&&typeof data==='object')Object.entries(data).forEach(([k,v])=>{if(typeof v==='string')out.push({name:k,url:v});else if(v&&v.link_embed)out.push({name:k,url:v.link_embed});else if(v&&v.url)out.push({name:k,url:v.url})});if(ep.link_embed)out.push({name:ep.server_name||'播放',url:ep.link_embed});if(ep.url)out.push({name:ep.server_name||'播放',url:ep.url})}return out.filter((x,i,a)=>x.url&&a.findIndex(y=>y.url===x.url)===i)}
async function openDetail(id){const previous={view:current.view,cat:current.cat,page:current.page,query:current.query,searchCat:current.searchCat};current={...current,view:'detail',detail:id};setStatus('正在读取详情…');view.innerHTML='<div class="empty">正在加载影片详情…</div>';try{const d=await jsonFetch(`/api/detail?id=${encodeURIComponent(id)}&lang=zh&bilingual=1`);const v=(d.list||[])[0];if(!v)throw new Error('没有找到影片详情');renderDetail(v,previous);setStatus('')}catch(e){setStatus(e.message,true);view.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function renderDetail(v,previous){const en=v._en||{};const cats=arr(cleanField(v.category,en.category)),actors=arr(cleanField(v.actor,en.actor)).join(' / ')||'—',directors=arr(cleanField(v.director,en.director)).join(' / ')||'—',sources=episodeSources(v.episodes);view.innerHTML=`<div class="pageHead"><button class="back" id="backBtn">← 返回</button><div><h2>${esc(v.movie_code||'影片详情')}</h2><div class="muted">${esc(v.type_name||'')}</div></div></div><div class="detailPage"><section class="detailLeft"><div class="detailHero"><img class="detailPoster" src="${esc(img(v))}" referrerpolicy="no-referrer" onerror="this.style.opacity=.15"><div><div class="detailTitle">${esc(cleanField(title(v),title(en)))}</div><div class="detailCode">${esc(v.movie_code||'')}</div><div class="kv">${cats.slice(0,16).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><div class="info"><div class="label">演员</div><div>${esc(actors)}</div><div class="label">导演</div><div>${esc(directors)}</div><div class="label">年份</div><div>${esc(v.year||'—')}</div><div class="label">时长</div><div>${esc(v.time||'—')}</div><div class="label">画质</div><div>${esc(v.quality||'—')}</div></div></div></div><div class="desc">${esc(cleanField(v.description,en.description)||'暂无简介')}</div></section><section class="detailRight"><div class="viewerTop"><div class="viewerTitle">播放</div><span class="notice">独立 GeckoView · 禁止新窗口</span></div><div class="sources">${sources.map((s,i)=>`<button class="srcbtn" data-src="${i}">${esc(s.name||('源 '+(i+1)))}</button>`).join('')||'<span class="notice">API 未返回播放地址</span>'}</div><div id="viewer" class="viewer"><div class="viewerHint">${sources.length?'选择播放源开始播放。播放器不再使用 iframe sandbox，以兼容源站检测。':'当前影片没有可用播放源。'}</div></div><div class="viewerFoot"><div class="hint">播放器使用 APK 内置 GeckoView 内核，不调用 Chrome、Edge 或系统 WebView。新窗口、新标签页和顶层外部跳转会由应用直接拒绝；播放器 iframe 本身不使用 sandbox。</div><div style="display:flex;gap:8px"><button id="fullscreenBtn" class="secondary" disabled>应用全屏（备用）</button><button id="restore" class="secondary" disabled>恢复播放</button></div></div></section></div>`;
 $('#backBtn').onclick=()=>{if(previous.view==='category')showCategory(previous.cat,previous.page);else if(previous.view==='search'){ $('#searchInput').value=previous.query; $('#searchScope').value=String(previous.searchCat||0); doSearch(previous.page)}else showHome()};
 document.querySelectorAll('.srcbtn').forEach(b=>b.onclick=()=>playSource(sources,Number(b.dataset.src),b));
}
function isDirect(url){return /\.(mp4|webm|ogg)(\?|#|$)/i.test(url)}
function playSource(sources,i,btn){const s=sources[i];if(!s)return;document.querySelectorAll('.srcbtn').forEach(x=>x.classList.remove('active'));btn.classList.add('active');current.sourceUrl=s.url;const viewer=$('#viewer'),restore=$('#restore'),fsBtn=$('#fullscreenBtn');restore.disabled=false;restore.onclick=()=>playSource(sources,i,btn);fsBtn.disabled=false;
 const syncFsButton=()=>{const own=document.fullscreenElement===viewer||document.webkitFullscreenElement===viewer;fsBtn.textContent=own?'退出应用全屏':'应用全屏（备用）'};
 const leaveAppFullscreen=async()=>{try{if(document.fullscreenElement===viewer&&document.exitFullscreen)await document.exitFullscreen();else if(document.webkitFullscreenElement===viewer&&document.webkitExitFullscreen)document.webkitExitFullscreen()}catch(e){setStatus('无法退出全屏：'+e.message,true)}};
 fsBtn.onclick=async()=>{try{if(document.fullscreenElement===viewer||document.webkitFullscreenElement===viewer){await leaveAppFullscreen()}else if(!document.fullscreenElement&&!document.webkitFullscreenElement){if(viewer.requestFullscreen)await viewer.requestFullscreen();else if(viewer.webkitRequestFullscreen)viewer.webkitRequestFullscreen()}else{setStatus('播放器已处于原生全屏，请先用播放器按钮或 Esc 退出。')}}catch(e){setStatus('无法切换应用全屏：'+e.message,true)}};
 document.removeEventListener('fullscreenchange',window.__avdbFsSync||(()=>{}));window.__avdbFsSync=syncFsButton;document.addEventListener('fullscreenchange',syncFsButton);
 document.removeEventListener('webkitfullscreenchange',window.__avdbFsSyncWebkit||(()=>{}));window.__avdbFsSyncWebkit=syncFsButton;document.addEventListener('webkitfullscreenchange',syncFsButton);
 const exitBtn='<button class="viewerExit" type="button" aria-label="退出应用全屏">退出全屏</button>';
 const bindExit=()=>{const x=viewer.querySelector('.viewerExit');if(x)x.onclick=leaveAppFullscreen};
if(isDirect(s.url)){viewer.innerHTML=`<video controls autoplay playsinline src="${esc(s.url)}"></video><div class="shield">禁止新窗口</div>${exitBtn}`;bindExit();return}
 // Compatibility mode: do not use the iframe sandbox. Some playback providers actively reject sandboxed embeds.
 // Popup/new-window protection is enforced by GeckoView NavigationDelegate before a new session is created.
 viewer.innerHTML=`<iframe src="${esc(s.url)}" allow="autoplay *; fullscreen *; picture-in-picture *; encrypted-media *" allowfullscreen="true" referrerpolicy="no-referrer"></iframe><div class="shield">禁止新窗口</div>${exitBtn}`;bindExit();
}
document.addEventListener('keydown',async e=>{if(e.key==='Escape'&&(document.fullscreenElement===document.getElementById('viewer')||document.webkitFullscreenElement===document.getElementById('viewer'))){try{if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}catch(_){}}});
$('#brand').onclick=()=>showHome();$('#navHome').onclick=()=>showHome();document.querySelectorAll('.nav button[data-cat]').forEach(b=>b.onclick=()=>showCategory(Number(b.dataset.cat),1));$('#searchBtn').onclick=()=>doSearch(1);$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(1)});
showHome();
</script>
