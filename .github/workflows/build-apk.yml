name: Build AVDB Mini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Find sdkmanager
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager -type f | head -1)
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using sdkmanager: $SDKMANAGER"

      - name: Install Android SDK 37.1
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platforms;android-37.1" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Show build environment
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle -v

          echo "===== ANDROID PLATFORMS ====="
          ls -la "$ANDROID_HOME/platforms"

          echo "===== BUILD TOOLS ====="
          ls -la "$ANDROID_HOME/build-tools"

      - name: Build APK
        run: |
          gradle clean :app:assembleDebug \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/AVDB-Mini-Android-Gecko-v2.0.apk

          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVDB-Mini-Android-Gecko-v2.0
          path: output/AVDB-Mini-Android-Gecko-v2.0.apk
          if-no-files-found: error
          retention-days: 30
