name: Build AVDB Mini APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Copy APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/AVDB-Mini-Android-Gecko.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVDB-Mini-Android-Gecko
          path: output/AVDB-Mini-Android-Gecko.apk
